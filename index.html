<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css" />
    <title>Flashcads</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Confere aí</h1>
        <nav>
            <a href="#">início</a>
        </nav>
    </header>
    <main>
        <h2>Descubra a verdade passando o mouse</h2>
        <article class="cartao">
            <div class="cartao-interno">
                <div class="cartao-frente">
                    <img src="https://pt.quizur.com/_image?href=https%3A%2F%2Fimg.quizur.com%2Ff%2Fimg6455216fe32f17.54926723.jpg%3FlastEdited%3D1683300737&w=400&h=400&f=webp" 
                    alt="minios" class="cartao-imagem">
                    <p>Os minios roxos são do bem!</p>
                </div>
                <div class="cartao-verso">
                    <img src="https://www.fatosdesconhecidos.com.br/wp-content/uploads/2015/06/despicable_me_2_minions-920x600.jpg" 
                    alt="minios" class="cartao-imagem"> 
                    <p>Na verdade os minios amarelos são do bem!</p>
                </div>
            </div>
        </article>
    </main>
    <footer>
        <p>Projeto feito por Isabelli Roberta.</p>
    </footer>
</body>

</html>
